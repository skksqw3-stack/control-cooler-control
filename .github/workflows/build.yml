name: Build Cooler APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Files
        run: flutter create . --platforms=android --org com.example

      - name: Install dependencies
        run: flutter pub get

      # این مرحله فایل‌های Gradle را برای سازگاری با اندروید جدید اصلاح می‌کند
      - name: Fix Gradle version
        run: |
          sed -i 's/classpath .*com.android.tools.build:gradle:.*/classpath "com.android.tools.build:gradle:7.4.2"/' android/build.gradle
          sed -i 's/classpath .*com.android.tools.build:gradle:.*/classpath "com.android.tools.build:gradle:7.4.2"/' android/build.gradle.kts
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 33/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 33/' android/app/build.gradle.kts

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
