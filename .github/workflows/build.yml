name: Build Cooler APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # اصلاح نام پکیج نامعتبر در pubspec.yaml
      - name: Fix Package Name
        run: |
          sed -i 's/^name: .*/name: cooler_app/' pubspec.yaml

      # ساخت پوشه اندروید با نام پکیج معتبر
      - name: Generate Android Files
        run: flutter create . --platforms=android --org com.example --project-name cooler_app

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
